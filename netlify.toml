[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set VITE_CONVEX_URL and VITE_CONVEX_SITE_URL in the Netlify UI for our own deployment (P5).

[[redirects]]
  from = "/api/*"
  # P5: point this at our own deployment, https://<name>.convex.site/api/:splat
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
